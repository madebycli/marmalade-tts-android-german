name: German Pocket test APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing fork release tag to attach the verified APK to (empty builds/tests only)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: german-pocket-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Native tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: german-pocket-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: german-pocket-${{ runner.os }}-
      - name: Unit tests (both distributions) and signed arm64 debug APK
        run: |
          mkdir -p ~/.cache
          flock ~/.cache/marmalade-gradle.lock ./gradlew :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest :app:assembleFdroidDebug -PgermanArm64 --no-daemon -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.workers.max=2
      - name: Verify tests and APK contents
        run: |
          python3 scripts/pocket-bundle/check_android_build.py
          APK=app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > APK_VERIFICATION.txt
          cp "$APK" Marmalade-Pocket-German-arm64.apk
          sha256sum Marmalade-Pocket-German-arm64.apk > APK_SHA256SUMS
          zip -q -r UNIT_TEST_REPORTS.zip app/build/test-results
      - name: Attach to the fork test release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$GITHUB_REPOSITORY" = 'madebycli/marmalade-tts-android-german'
          gh release upload "$RELEASE_TAG" Marmalade-Pocket-German-arm64.apk APK_SHA256SUMS APK_VERIFICATION.txt TEST_RESULTS.json UNIT_TEST_REPORTS.zip --clobber
